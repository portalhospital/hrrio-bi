<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal BI – Hospital de Niños Roberto del Río</title>
<style>
  :root{
    --azul:#0f3d63; --azul-2:#1d5f8f; --amarillo:#f6c945;
    --texto:#1f2d3a; --tarjeta:#ffffff; --sombra:0 6px 18px rgba(15,61,99,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--texto); background:#eef4f8; min-height:100vh;
  }

  /* ---------- CABECERA ---------- */
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(15,61,99,.92); backdrop-filter:blur(6px);
    color:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:14px 32px; gap:16px; flex-wrap:wrap;
  }
  .marca{font-weight:700; letter-spacing:.06em; font-size:1.15rem}
  .marca span{color:var(--amarillo)}
  nav a{color:#dbe8f3; text-decoration:none; margin-left:22px; font-size:.95rem}
  nav a:hover{color:#fff}

  /* ---------- PORTADA CON IMAGEN ---------- */
  .hero{
    position:relative; min-height:62vh;
    background:url("fondo.jpg") center 40%/cover no-repeat;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .hero::after{ /* oscurece levemente la parte baja para que se lea el texto */
    content:""; position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(10,35,60,.55) 100%);
  }
  .banda{
    position:relative; z-index:1; width:100%; text-align:center; color:#fff;
    padding:28px 16px 90px;
  }
  .banda h1{font-size:clamp(2rem,5vw,3.4rem); font-weight:800; text-shadow:0 2px 10px rgba(0,0,0,.45)}
  .banda p{font-size:clamp(1rem,2vw,1.2rem); margin-top:6px; text-shadow:0 1px 6px rgba(0,0,0,.5)}

  /* ---------- TARJETAS ---------- */
  main{max-width:1200px; margin:-70px auto 40px; padding:0 16px; position:relative; z-index:2}
  .grilla{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,280px)); justify-content:center; gap:24px}
  .tarjeta{
    background:var(--tarjeta); border-radius:10px; box-shadow:var(--sombra);
    padding:28px 16px 24px; text-align:center; text-decoration:none; color:var(--texto);
    display:flex; flex-direction:column; align-items:center; gap:16px;
    transition:transform .18s ease, box-shadow .18s ease; border-bottom:4px solid transparent;
  }
  .tarjeta:hover, .tarjeta:focus-visible{
    transform:translateY(-6px); box-shadow:0 14px 30px rgba(15,61,99,.22);
    border-bottom-color:var(--c); outline:none;
  }
  .icono{
    width:76px; height:76px; border-radius:50%; display:grid; place-items:center;
    background:var(--bg); color:var(--c); transition:transform .18s ease;
  }
  .tarjeta:hover .icono{transform:scale(1.08)}
  .icono svg{width:38px; height:38px}
  .tarjeta h2{font-size:1.05rem; font-weight:600}
  .tarjeta small{font-size:.8rem; color:#6b7c8c; margin-top:-8px}

  footer{text-align:center; color:#5d6f80; font-size:.85rem; padding:24px 16px 32px}

  @media (max-width:900px){ nav{display:none} }
  @media (max-width:520px){ .grilla{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:480px){ .grilla{gap:14px} .tarjeta{padding:20px 10px} header{padding:12px 16px} }
</style>
</head>
<body>

<header>
  <div class="marca">HRR · <span>Unidad de Estadística</span></div>
  <nav>
    <a href="#">Inicio</a>
    <a href="#">Misión / Objetivos</a>
    <a href="#">Conózcanos</a>
    <a href="#">Contacto</a>
  </nav>
</header>

<section class="hero">
  <div class="banda">
    <h1>Estadísticas</h1>
    <p>Tableros de gestión – Hospital de Niños Roberto del Río</p>
  </div>
</section>

<main>
  <div class="grilla" id="grilla"></div>
</main>

<footer>Hospital de Niños Roberto del Río · Unidad de Estadística</footer>

<script>
/* =========================================================
   CONFIGURACIÓN: reemplace cada "url" por el enlace de su BI
   (Power BI, Tableau, Looker Studio, etc.)
   ========================================================= */
const TABLEROS = [
  { nombre:"Lista de Espera", url:"https://app.powerbi.com/view?r=eyJrIjoiYjEyZTVmZDgtNjQ5YS00YmI5LWI5M2UtYjg3NTZkZDRkYzc0IiwidCI6Ijc0NDRkNTdjLTA0YzgtNDJkZS1hMDgxLWRkODk5YWYyOTIyZSIsImMiOjR9&pageName=89c31e4b8cffb2fe4a53", c:"#e8822a", bg:"#fde3c8", icono:"lista" },
  { nombre:"GES",             url:"https://app.powerbi.com/view?r=eyJrIjoiMjc3ZGM5ZDQtNDcxOS00ZWY4LWEyOTQtN2QxZjc0NmZmNTRkIiwidCI6Ijc0NDRkNTdjLTA0YzgtNDJkZS1hMDgxLWRkODk5YWYyOTIyZSIsImMiOjR9&pageName=bf27b6a6606c31e95506", c:"#1f8a5b", bg:"#cdeedd", icono:"escudo" }

  /* Para agregar más botones, copie una línea como esta (con coma al final de la anterior):
  ,{ nombre:"Egresos Hospitalarios",  url:"PEGAR-URL", c:"#a43fc4", bg:"#ecd5f5", icono:"cama" }
  ,{ nombre:"Estadísticas REM",       url:"PEGAR-URL", c:"#2479b8", bg:"#cfe6f7", icono:"barras" }
  ,{ nombre:"Mortalidad",             url:"PEGAR-URL", c:"#c8323c", bg:"#f8d4d6", icono:"pulso" }
  ,{ nombre:"Prestaciones",           url:"PEGAR-URL", c:"#2f5fc8", bg:"#d3def9", icono:"medico" }
  ,{ nombre:"Atenciones de Urgencia", url:"PEGAR-URL", c:"#0b8fa8", bg:"#c9eef5", icono:"ambulancia" }
  ,{ nombre:"Monitoreo de Metas",     url:"PEGAR-URL", c:"#b9369a", bg:"#f5d3ec", icono:"torta" }
  */
];

/* Íconos SVG (no requieren internet ni librerías externas) */
const ICONOS = {
  lista:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  escudo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  cama:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6v13M3 14h18v5M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/></svg>',
  barras:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18"/><path d="M6 17v-5M10 17V7M14 17v-8M18 17V4"/></svg>',
  pulso:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/><path d="M3.5 12h4l1.5-3 3 6 1.5-3h7"/></svg>',
  medico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/><path d="M9 14v3a2 2 0 0 0 4 0"/><circle cx="16" cy="17.5" r="1.5"/></svg>',
  ambulancia:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16V7a1 1 0 0 1 1-1h11v10"/><path d="M14 9h4l4 4v3h-2"/><path d="M8 9v4M6 11h4"/><circle cx="7" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/><path d="M9 17h6"/></svg>',
  torta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>'
};

const grilla = document.getElementById("grilla");
TABLEROS.forEach(t => {
  const a = document.createElement("a");
  a.className = "tarjeta";
  a.href = t.url;
  a.target = "_blank";            // abre el BI en una pestaña nueva
  a.rel = "noopener";
  a.style.setProperty("--c", t.c);
  a.style.setProperty("--bg", t.bg);
  a.innerHTML = `<div class="icono">${ICONOS[t.icono]}</div><h2>${t.nombre}</h2>`;
  grilla.appendChild(a);
});
</script>
</body>
</html>
